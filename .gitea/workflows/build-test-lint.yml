name: lint-build-test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v3
        with:
          submodules: 'true'
      - name: Setup container
        run: apt-get update && apt-get upgrade && apt-get install ninja-build
      - name: Install CMake
        uses: lukka/get-cmake@v3.21.2
      - name: Setup vcpkg for dependencies
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false
      - name: Build and Test
        uses: lukka/run-cmake@v10.7
        with: 
          configurePreset: ubuntu-runner-config
          buildPreset: ubuntu-runner-debug
          testPreset: ubuntu-runner-test
      - name: Linter
        working-directory: ./build/ubuntu-runner-config
        run: run-clang-tidy
