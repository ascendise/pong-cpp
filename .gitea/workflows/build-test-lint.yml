name: lint-build-test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-cmake
    steps:
      - name: Checkout project
        uses: actions/checkout@v3
        with:
          submodules: 'true'
      - name: Install build dependencies
        run: apt-get istall python3-jinja2
      - name: Build and Test
        uses: lukka/run-cmake@v10.7
        with: 
          configurePreset: dev-vcpkg-ninja
          buildPreset: dev-vcpkg-debug
          testPreset: dev-vcpkg-test
      - name: Linter
        working-directory: ./build/dev-vcpkg-ninja
        run: run-clang-tidy
